name: Prisma migrations

on:
  pull_request:
    paths:
      - 'services/**/prisma/**'
      - 'services/**/prisma.config.ts'
      - 'services/**/prisma7.config.ts'
      - 'tools/prisma/**'
      - '.github/workflows/prisma-migrations.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'services/**/prisma/**'
      - 'services/**/prisma.config.ts'
      - 'services/**/prisma7.config.ts'
      - 'tools/prisma/**'
      - '.github/workflows/prisma-migrations.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

concurrency:
  group: prisma-migrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: galatura_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d galatura_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/galatura_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/galatura_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:check:static
      - run: pnpm prisma:check
