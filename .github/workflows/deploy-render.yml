name: Deploy Render

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
      - turbo.json
      - .github/workflows/deploy-render.yml
      - tools/render/**
      - packages/**
      - services/**
      - infra/render/**
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run without changing Render
        type: boolean
        default: false

concurrency:
  group: deploy-render-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      ROOT_ENV: ${{ secrets.ROOT_ENV }}
      RENDER_WORKSPACE_ID: ${{ secrets.RENDER_WORKSPACE_ID }}
      RENDER_ENVIRONMENT_ID: ${{ secrets.RENDER_ENVIRONMENT_ID }}
      RENDER_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      RENDER_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Verify Render secrets
        run: |
          missing=()
          if [ -z "${RENDER_API_KEY}" ]; then missing+=("RENDER_API_KEY"); fi
          if [ -z "${ROOT_ENV}" ]; then missing+=("ROOT_ENV"); fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub secret(s): ${missing[*]}"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node tools/render/deploy.mjs --dry-run
      - name: Apply deploy
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: node tools/render/deploy.mjs --apply
