receivers:
  otlp:
    protocols:
      grpc:
        endpoint: '${env:OTEL_COLLECTOR_GRPC_ENDPOINT}'
      http:
        endpoint: '${env:OTEL_COLLECTOR_HTTP_ENDPOINT}'

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  filter:
    traces:
      span:
        - 'attributes["http.route"] == "/healthz" or attributes["http.route"] == "/readyz" or attributes["http.route"] == "/metrics" or attributes["url.path"] == "/healthz" or attributes["url.path"] == "/readyz" or attributes["url.path"] == "/metrics"'
    metrics:
      metric:
        - 'attributes["http.route"] == "/healthz" or attributes["http.route"] == "/readyz" or attributes["http.route"] == "/metrics" or attributes["url.path"] == "/healthz" or attributes["url.path"] == "/readyz" or attributes["url.path"] == "/metrics"'
    logs:
      log_record:
        - 'attributes["http.route"] == "/healthz" or attributes["http.route"] == "/readyz" or attributes["http.route"] == "/metrics" or attributes["url.path"] == "/healthz" or attributes["url.path"] == "/readyz" or attributes["url.path"] == "/metrics" or attributes["event"] == "health.check"'
  resource:
    attributes:
      - key: deployment.environment
        value: '${env:DEPLOYMENT_ENVIRONMENT}'
        action: upsert
      - key: service.namespace
        value: '${env:SERVICE_NAMESPACE}'
        action: upsert
  batch:
    timeout: 5s
    send_batch_size: 512
    send_batch_max_size: 1024

exporters:
  otlp:
    endpoint: '${env:OTLP_BACKEND_ENDPOINT}'
    tls:
      insecure: '${env:OTLP_BACKEND_INSECURE}'
    headers:
      authorization: '${env:OTLP_BACKEND_AUTH_HEADER}'
  prometheus:
    endpoint: '${env:COLLECTOR_PROMETHEUS_ENDPOINT}'

extensions:
  health_check:
    endpoint: '${env:COLLECTOR_HEALTH_ENDPOINT}'

service:
  extensions:
    - health_check
  pipelines:
    traces:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - filter
        - resource
        - batch
      exporters:
        - otlp
    metrics:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - filter
        - resource
        - batch
      exporters:
        - otlp
        - prometheus
    logs:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - filter
        - resource
        - batch
      exporters:
        - otlp
  telemetry:
    logs:
      level: '${env:COLLECTOR_LOG_LEVEL}'
