[project]
name = "galatura-accounts"
version = "0.1.0"
description = "Galatura accounts, ledger and payroll desktop client (PySide6)."
requires-python = ">=3.11"
dependencies = [
  "galatura-desktop-core",
  "PySide6>=6.7",
  "requests>=2.31",
  "keyring>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
galatura-accounts = "galatura_accounts.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galatura_accounts"]

[tool.uv.sources]
galatura-desktop-core = { path = "../desktop-core", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"
