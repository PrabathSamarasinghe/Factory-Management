[project]
name = "galatura-admin"
version = "0.1.0"
description = "Galatura Factory Management admin console (PySide6)."
requires-python = ">=3.11"
dependencies = [
  "galatura-desktop-core",
  "PySide6>=6.7",
  "requests>=2.31",
  "keyring>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
galatura-admin = "galatura_admin.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galatura_admin"]

[tool.uv.sources]
galatura-desktop-core = { path = "../desktop-core", editable = true }
