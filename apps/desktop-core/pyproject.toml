[project]
name = "galatura-desktop-core"
version = "0.1.0"
description = "Shared PySide6 foundation for Galatura desktop apps (API client, auth, theme, widgets)."
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "requests>=2.31",
  "keyring>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galatura_desktop_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
